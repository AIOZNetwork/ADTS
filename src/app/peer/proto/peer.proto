syntax = "proto3";

package app.peer.proto;

import "google/protobuf/empty.proto";

message ModelMetadata {
  string node_id = 1;
  int32 round = 2;
  int64 num_samples = 3;
  string model_hash = 4;
}

message ModelUpdate {
  ModelMetadata meta = 1;
  repeated bytes tensors = 2;
}

message Ack {
  bool ok = 1;
}

message EvalWithModelRequest {
  repeated bytes parameters = 1;
}

message EvalResponse {
  map<string, float> metrics = 1;
}

message ModelRequest {
  string model_key = 1; // "latest", "round-5", etc
}

message RoundRequest {
  int32 round = 1;
}

message ModelResponse {
  repeated bytes parameters = 1;
}

message InferenceRequest {
  repeated bytes parameters = 1;
  bytes inputs = 2;
}

message InferenceResponse {
  bytes outputs = 1;
}

message RoundRecord {
  int32 round = 1;
  string train_started_at = 2;
  string train_finished_at = 3;
  map<string, bool> send_status = 4;
  map<string, bool> receive_status = 5;
}

message NodeStatusResponse {
  int32 current_round = 1;
  string status = 2;
  map<int32, RoundRecord> round_records = 3;
}

service PeerFL {
  rpc PushModel(ModelUpdate) returns (Ack);

  // Fetch raw model parameters
  rpc GetModel(ModelRequest) returns (ModelResponse);

  // Evaluate with externally provided parameters (for mixing)
  rpc EvaluateWithModel(EvalWithModelRequest) returns (EvalResponse);

  // Run inference using stored model
  rpc InferenceWithModel(InferenceRequest) returns (InferenceResponse);

  // Get node info
  rpc GetNodeInfo(RoundRequest) returns (NodeStatusResponse);
}
