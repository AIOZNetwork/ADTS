syntax = "proto3";

package topology;

import "google/protobuf/empty.proto";

service TopologyService {

  // Node lifecycle
  rpc RegisterNode (NodeInfo) returns (Ack);

  // Resolve topology for a Flower round
  rpc GetTopology (RoundRequest) returns (Topology);

  // Get topologies for all rounds
  rpc ListTopologies (google.protobuf.Empty) returns (TopologyList);

  // Get number of topology
  rpc GetNumTopology (google.protobuf.Empty) returns (NumTopology);

  // Push user-triggered training events
  rpc SubscribeTriggers (NodeId) returns (stream TrainingTrigger);

  // User → Topology Server → Nodes
  rpc TriggerTraining (TrainingRequest) returns (Ack);

  rpc ListNodes(google.protobuf.Empty) returns (NodeList);

  rpc SubscribeTopologyChanges(TopologyChangeRequest) returns (stream TopologyChange);
}

message TopologyChangeRequest {
  string node_id = 1;
  int64 last_seen_version = 2;
}

message TopologyChange {
  int64 topology_version = 1;
  string topology_instance_id = 2;
}

message RoundRequest {
  int32 round_id = 1;
}

message NodeId {
  string node_id = 1;
}

message NodeInfo {
  string node_id = 1;
  string peer_address = 2;
}

message NodeDetails {
  string address = 2;
  float weight = 3;
  repeated string send_ids = 4;
  repeated string recv_ids = 5;
}

message Topology {
  map<string, NodeDetails> graph = 2;
}

message TrainingRequest {
  int32 round_id = 1;
}

message TrainingTrigger {
  int32 round_id = 1;
}

message NumTopology {
  int32 num_topology = 1;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message NodeList {
  repeated NodeInfo nodes = 1;
}

message TopologyList {
  map<string, Topology> topologies = 1;
  string topology_instance_id = 2;
  int64 topology_version = 3;
}